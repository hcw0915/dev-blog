<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino UI Parts</title>
  <!-- 原始 pen：https://codepen.io/hcw0915/pen/MWNmjbE -->

</head>
<body>
<span class="gold">MULTIPLICADOR</span>
<span class="gold">1250x</span>

<div class="text-stroke">text-stroke</div>

<div class="play">PLAY</div>

<!-- https://codepen.io/ZoranJambor/pen/RwxKOKM -->


<div class='DB-container'>
  <div class="DB-wrapper">
    <div class="DB-left" style="width:66px;">Blance</div>
    <div class="DB-right" style="width:142px;"></div>
  </div>
  <div class="DB-wrapper">
    <div class="DB-left" style="width:56px;">Total Bet</div>
    <div class="DB-right" style="width:87px;"></div>
  </div>
</div>

<div class="wheel-container">
  <div class="sector1">50</div>
  <div class="sector2">50</div>
  <div class="sector3">50</div>

  
</div>
<br/>


<div class='shadow'>How to Participate:</div>
<br/>

<div class="banner2"></div>
<br/>

<div class="deposit2" data-content='FIRST DEPOSIT 1,000,000'>FIRST DEPOSIT 1,000,000</div>
<br/>

<div class="deposit">FIRST DEPOSIT</div>
<br/>
  
  
<!--  Combination  -->
<div class="result-container">
  <!--  左上角  -->
  <div class="wrapper">
    <div class="game-result"></div>
  </div>
  <div class="card-result">
  <!--  主體  -->
    <div class="decorate"></div>
    <div class="player"> 閒1 </div>
    <div class="card-wrapper">
      <div class='empty-card'></div>
      <div class='empty-card'></div>
      <div class='empty-card'></div>
      <div class='empty-card'></div>
      <div class='empty-card'></div>
    </div>
  </div>
  
</div>
 
<br/>
  
  
<br/>
