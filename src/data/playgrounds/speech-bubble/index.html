<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Bubble</title>
  <!-- 原始 pen：https://codepen.io/hcw0915/pen/yyJwmvE -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="chat" aria-label="Chat">
  <p class="bubble bubble--left">Did the new build pass?</p>
  <p class="bubble bubble--right bubble--purple">All green. Deploying now.</p>
  <p class="bubble bubble--left bubble--green">Nice, ping me when it is live.</p>
  <p class="bubble bubble--bottom-right bubble--red">It's live. The preview link is in the channel.</p>
</main>
</body>
</html>
