<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip</title>
  <!-- 原始 pen：https://codepen.io/hcw0915/pen/EaPZgmj -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <button class="card" type="button" aria-pressed="false" aria-label="Flip card">
    <span class="card-inner">
      <span class="face face-down"></span>
      <span class="face face-up">
        <span class="corner corner-top"><span>A</span><span>&spades;</span></span>
        <span class="pip" aria-hidden="true">&spades;</span>
        <span class="corner corner-bottom"><span>A</span><span>&spades;</span></span>
      </span>
    </span>
  </button>
  <p class="hint">Click the card to flip</p>
</main>
<script src="index.js"></script>
</body>
</html>
