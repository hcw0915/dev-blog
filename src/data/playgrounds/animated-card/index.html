<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Animated Card</title>
</head>
<body>
  <div class="card-container">
    <div class="card" id="card">
      <div class="card-header">
        <h2>动画卡片</h2>
      </div>

        <p>悬停或点击卡片查看动画效果</p>
        <button class="card-btn">了解更多</button>
      </div>
    </div>
  </div>
</body>
</html>
